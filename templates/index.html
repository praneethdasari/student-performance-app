<!DOCTYPE html>
<html>
<head>
    <title>Student Predictor</title>
</head>
<body>

<h2>Student Performance Predictor</h2>

<form action="/predict" method="post">
    <input type="number" step="0.1" name="hours" placeholder="Hours Studied" required><br><br>
    <input type="number" name="attendance" placeholder="Attendance (%)" required><br><br>
    <input type="number" name="previous" placeholder="Previous Score" required><br><br>

    <button type="submit">Predict</button>
</form>

{% if prediction %}
<h3>Result: {{ prediction }}</h3>
{% endif %}

</body>
</html>
