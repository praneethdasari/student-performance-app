<!DOCTYPE html>
<html>
<head>
    <title>Student Performance Predictor</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h2>Student Performance Predictor</h2>
    <p style="color: #ccc; font-size: 14px; margin-bottom: 15px;">
        Predict final score using study data
    </p>

    <form action="/predict" method="post">

        <input 
            type="number" 
            step="0.1" 
            name="hours" 
            placeholder="Hours Studied" 
            required
        >

        <input 
            type="number" 
            name="attendance" 
            placeholder="Attendance (%)" 
            required
        >

        <input 
            type="number" 
            name="previous" 
            placeholder="Previous Score" 
            required
        >

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}
    <div class="result">
        Predicted Score: {{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
